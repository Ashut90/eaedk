<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EAEDK — Mentor</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="chat-widget.js" defer></script>
  <style> .capicon { font-size: 22px; margin-right: 8px; } </style>
</head>
<body>
  <nav class="top"></nav>
  <main>
    <h1>Mentor</h1>
    <p class="sub">Pick your board and EAEDK acts like a senior engineer beside you: what the
      board can do, what to build in what order, and the answer to any question you type.</p>

    <div class="card">
      <label for="board">Board</label>
      <select id="board"><option value="">Loading boards…</option></select>
    </div>

    <div id="detail"></div>

    <div class="card">
      <h2 style="margin-top:0">Chat with the mentor</h2>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div><label for="project">Project (so I can track your progress)</label>
          <select id="project"><option value="">No project</option></select></div>
        <div><label>Hardware</label>
          <label style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="hw" style="width:auto"> I have a physical board
            (otherwise I'll point you at Wokwi)</label></div>
      </div>
      <div id="chat" style="max-height:420px;overflow:auto;margin-top:10px"></div>
      <label for="q">Your message</label>
      <input type="text" id="q" placeholder="e.g. what is a clock? / how am I doing?" autocomplete="off">
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <input type="checkbox" id="ai" style="width:auto" checked> Use the AI model for chattier answers
        (optional, needs the local model)</label>
      <button id="ask">Send</button>
    </div>
  </main>

  <script>
    const ICONS = { gpio:"🔌", uart:"🔤", spi:"🔗", i2c:"🧵", timer:"⏱️", usb:"🔵",
                    wifi:"📶", bluetooth:"🟦", ethernet:"🌐", adc:"📈", can:"🚗" };

    async function init() {
      const boards = await api("/api/boards");
      const sel = document.getElementById("board");
      sel.innerHTML = boards.error ? `<option value="">(couldn't load)</option>`
        : `<option value="">— Select a board —</option>` +
          boards.boards.map(b => `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)}</option>`).join("");
      sel.addEventListener("change", loadBoard);
      const ps = await api("/api/projects");
      if (!ps.error && ps.projects.length) {
        document.getElementById("project").innerHTML = `<option value="">No project</option>` +
          ps.projects.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("");
      }
    }

    async function loadBoard() {
      const name = document.getElementById("board").value;
      if (!name) return;
      const el = document.getElementById("detail");
      el.innerHTML = `<p class="kv">Loading…</p>`;
      const d = await api("/api/boards/" + encodeURIComponent(name));
      if (d.error) { showError(el, d); return; }
      const caps = d.capabilities.map(c => {
        const icon = ICONS[c.capability] || "•";
        return `<div class="card"><span class="capicon">${icon}</span><b>${escapeHtml(c.capability.toUpperCase())}</b>
          <div class="kv" style="margin-top:4px">${escapeHtml(c.summary||"")}</div></div>`;
      }).join("");
      const steps = d.learning_path.map(s => `
        <div class="card"><b>${s.step}. ${escapeHtml(s.title)}</b>
          <div class="kv" style="margin:6px 0">${escapeHtml(s.why)}</div>
          ${s.before_you_start.length ? `<details><summary>Before you write code (${s.before_you_start.length})</summary>
            <ul>${s.before_you_start.map(b=>`<li>${escapeHtml(b)}</li>`).join("")}</ul></details>` : ""}
        </div>`).join("");
      let driver = "";
      if (d.driver_path && d.driver_path.length) {
        const dsteps = d.driver_path.map(s => `
          <div class="card"><b>${s.step}. ${escapeHtml(s.title)}</b>
            <div class="kv" style="margin:6px 0">${escapeHtml(s.why)}</div>
            <details><summary>What it is, kernel functions, what to build</summary>
              <ul>${s.before_you_start.map(b=>`<li>${escapeHtml(b)}</li>`).join("")}</ul></details>
          </div>`).join("");
        driver = `<details style="margin-top:18px"><summary style="font-size:17px">
          🐧 Driver Development (this board runs Linux) — ${d.driver_path.length} steps</summary>
          <p class="kv" style="margin:8px 0">Once Linux boots, this is the order to learn writing
          kernel drivers.</p>${dsteps}</details>`;
      }
      el.innerHTML = `<h2>What this board can do</h2><div class="grid cols">${caps}</div>
        <h2>Your learning path</h2>${steps}${driver}`;
    }

    let HISTORY = [];   // conversation persists within this browser session

    function renderChat() {
      document.getElementById("chat").innerHTML = HISTORY.map(m => `
        <div class="card" style="border-color:${m.role==='user'?'var(--line)':'var(--accent)'}">
          <b class="kv">${m.role === "user" ? "You" : "Mentor"}</b>
          <div class="msg-text">${m.role === "user" ? escapeHtml(m.content) : renderMd(m.content)}</div>
        </div>`).join("");
      const box = document.getElementById("chat"); box.scrollTop = box.scrollHeight;
    }

    async function ask() {
      const board = document.getElementById("board").value;
      const q = document.getElementById("q").value.trim();
      const use_llm = document.getElementById("ai").checked;
      if (!q) return;
      HISTORY.push({ role: "user", content: q });
      document.getElementById("q").value = "";
      const project = document.getElementById("project").value || null;
      const has_hardware = document.getElementById("hw").checked;
      // Add a live assistant entry that updates as SSE chunks arrive.
      HISTORY.push({ role: "assistant", content: "" });
      renderChat();
      const liveEl = document.getElementById("chat").lastElementChild
                              .querySelector(".msg-text");
      if (liveEl) liveEl.textContent = "thinking…";

      let fullText = "";
      try {
        const resp = await fetch("/api/chat/stream", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            board_name: board, page_type: "mentor", user_message: q,
            use_llm, project_name: project, wokwi_flag: !has_hardware,
            conversation_history: HISTORY.slice(0, -1).filter(m => m.role !== "assistant" || m.content)
          })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let answered = false;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop() || "";
          for (const block of blocks) {
            const line = block.replace(/^data: /, "").trim();
            if (!line) continue;
            let evt;
            try { evt = JSON.parse(line); } catch { continue; }
            if (evt.type === "thinking") {
              if (liveEl) liveEl.textContent = `thinking… ${evt.elapsed}s`;
            } else if (evt.type === "chunk") {
              if (!answered) { if (liveEl) liveEl.textContent = ""; answered = true; }
              fullText += evt.text;
              if (liveEl) liveEl.innerHTML = renderMd(fullText);
              const box = document.getElementById("chat");
              box.scrollTop = box.scrollHeight;
            } else if (evt.type === "error") {
              if (liveEl) liveEl.textContent = evt.error || "Something went wrong.";
            }
          }
        }
      } catch (e) {
        if (liveEl) liveEl.textContent = "Could not reach the EAEDK server.";
      }
      HISTORY[HISTORY.length - 1].content = fullText;
    }

    // start a fresh conversation when the board changes
    document.getElementById("board") && document.getElementById("board")
      .addEventListener("change", () => { HISTORY = []; renderChat(); });

    document.addEventListener("DOMContentLoaded", () => {
      init();
      document.getElementById("ask").addEventListener("click", ask);
      document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
      mountChat({ page_type: "mentor",
        placeholder: "Ask anything — what to build, why something works, how to think about a problem…",
        getContext: () => ({
          board_name: document.getElementById("board").value,
          project_name: document.getElementById("project").value || null,
          wokwi_flag: !document.getElementById("hw").checked }) });
    });
  </script>
</body>
</html>
