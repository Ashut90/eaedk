<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EAEDK — Code Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="chat-widget.js" defer></script>
  <style> #editor { min-height: 360px; } </style>
</head>
<body>
  <nav class="top"></nav>
  <main>
    <h1>Code Studio</h1>
    <p class="sub">Write your firmware with a deterministic reviewer watching. Start from the
      template, edit it, then click Review — real problems are confirmed by the engine in RED;
      AI suggestions appear in YELLOW.</p>

    <div class="card">
      <label for="project">Project</label>
      <select id="project"><option value="">Loading projects…</option></select>
      <span id="board-label" class="kv" style="margin-left:10px;font-size:13px"></span>
    </div>

    <div id="checklist"></div>
    <div id="driver"></div>

    <div class="card">
      <h2 style="margin-top:0">Your code</h2>
      <textarea id="editor" class="mono" spellcheck="false"></textarea>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button id="review">Review my code</button>
        <a id="back-validate" href="validate.html" style="display:none">
          <button class="ghost">← Back to Validate</button></a>
      </div>
    </div>

    <div id="result"></div>
  </main>

  <script>
    let CURRENT_BOARD = null, LAST_REVIEW = null;

    async function init() {
      const ps = await api("/api/projects");
      const sel = document.getElementById("project");
      if (ps.error || !ps.projects.length) {
        sel.innerHTML = `<option value="">(no projects yet)</option>`;
        document.getElementById("checklist").innerHTML =
          `<div class="note">No projects yet. Create one on the <a href="setup.html">New Project</a> page.</div>`;
        return;
      }
      sel.innerHTML = ps.projects.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("");
      const urlProject = new URLSearchParams(location.search).get("project");
      if (urlProject && ps.projects.some(p => p.name === urlProject)) sel.value = urlProject;
      sel.addEventListener("change", loadStudio);
      loadStudio();
    }

    async function loadStudio() {
      const project = document.getElementById("project").value;
      if (!project) return;
      showCommand(`eaedk --llm mentor --board <board> --project ${project} --review-code`);
      const d = await api("/api/studio/" + encodeURIComponent(project));
      if (d.error) { showError(document.getElementById("checklist"), d); return; }
      CURRENT_BOARD = d.board || null;
      document.getElementById("board-label").textContent = CURRENT_BOARD ? `Board: ${CURRENT_BOARD}` : "";
      const backLink = document.getElementById("back-validate");
      backLink.href = `validate.html?project=${encodeURIComponent(project)}`;
      backLink.style.display = "";
      document.getElementById("editor").value = d.template || "";
      const cl = d.checklist.length
        ? `<div class="card"><h2 style="margin-top:0">Before you write — think about these</h2>` +
          d.checklist.map(c => `<div class="teach">✓ <b>${escapeHtml(c.question)}</b><br>
            <span class="kv">${escapeHtml(c.hint)}</span></div>`).join("") + `</div>`
        : "";
      document.getElementById("checklist").innerHTML = cl;
      document.getElementById("driver").innerHTML = (d.driver_path && d.driver_path.length)
        ? `<details class="card"><summary style="font-size:16px">🐧 Driver development path (${d.driver_path.length} steps)</summary>` +
          d.driver_path.map(s => `<div class="teach"><b>${s.step}. ${escapeHtml(s.title)}</b><br>
            <span class="kv">${escapeHtml(s.why)}</span></div>`).join("") + `</details>`
        : "";
    }

    async function review() {
      const project = document.getElementById("project").value;
      const code = document.getElementById("editor").value;
      const el = document.getElementById("result");
      if (!project) return;
      showCommand(`eaedk --llm mentor --board <board> --project ${project} --review-code`);
      el.innerHTML = `<p class="kv">Reviewing…</p>`;
      const r = await api(`/api/studio/${encodeURIComponent(project)}/review`, { method: "POST",
        headers: {"Content-Type":"application/json"}, body: JSON.stringify({ project, code }) });
      if (r.error) { showError(el, r); return; }
      LAST_REVIEW = r;
      const confirmed = r.confirmed.length
        ? r.confirmed.map(c => `<div class="card" style="border-color:var(--red)">
            <div>${badge("Problem", "RED")} &nbsp;<b>${escapeHtml(humanizeRule(c.check))}</b></div>
            <div class="kv" style="margin:6px 0">${escapeHtml(humanizeKeys(c.what))}</div>
            ${c.why ? `<div class="teach"><b>What to change:</b> ${escapeHtml(humanizeKeys(c.why))}</div>` : ""}
          </div>`).join("")
        : `<div class="note">✅ No real problems found by the engine.</div>`;
      const advisory = r.advisory.length
        ? `<h2>Advisory — AI suggestions (not proven)</h2>` + r.advisory.map(a => `
            <div class="card" style="border-color:var(--yellow)">
              <div>${badge("Suggestion", "YELLOW")} &nbsp;<b>${escapeHtml(a.check || "Suggestion")}</b></div>
              <div class="kv" style="margin-top:6px">${escapeHtml(humanizeKeys(a.what))}
                ${a.note ? "— " + escapeHtml(a.note) : ""}</div></div>`).join("")
        : "";
      let complete = "";
      if (r.can_complete && r.can_complete.length) {
        const btns = r.can_complete.map(i =>
          `<button class="ghost complete-btn" data-key="${escapeHtml(i.item_key)}"
            data-title="${escapeHtml(i.title)}" style="margin:4px">✓ ${escapeHtml(i.title)}</button>`
        ).join("");
        complete = `<div class="card" style="border-color:var(--green)">
          <b>✅ No real problems — ready to mark progress.</b>
          <p class="kv">Confirm a checklist item you've finished:</p>
          ${btns}<div id="markmsg"></div></div>`;
      }
      el.innerHTML = `<h2>Confirmed by the engine — fix these</h2>${confirmed}${advisory}${complete}
        ${r.ai_note ? `<div class="note">${escapeHtml(r.ai_note)}</div>` : ""}
        <div style="margin-top:14px">
          <a href="validate.html?project=${encodeURIComponent(project)}">
            <button class="ghost">← Re-run Validate</button></a>
        </div>`;
      el.querySelectorAll(".complete-btn").forEach(btn => {
        btn.addEventListener("click", () => markComplete(btn.dataset.key, btn.dataset.title));
      });
    }

    async function markComplete(itemKey, title) {
      const project = document.getElementById("project").value;
      showCommand(`eaedk checklist done ${project} ${itemKey}`);
      const r = await api(`/api/studio/${encodeURIComponent(project)}/complete`, { method: "POST",
        headers: {"Content-Type":"application/json"}, body: JSON.stringify({ project, item_key: itemKey }) });
      const msg = document.getElementById("markmsg");
      if (r.error) { showError(msg, r); return; }
      msg.innerHTML = `<div class="note" style="margin-top:10px">Marked "${escapeHtml(r.marked)}"
        complete. Progress: ${r.complete}/${r.total} (${r.percent}%).</div>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      init();
      document.getElementById("review").addEventListener("click", review);
      mountChat({ page_type: "studio",
        placeholder: "Ask about your code, why something works, or what to consider next…",
        getContext: () => ({
          board_name: CURRENT_BOARD,
          project_name: document.getElementById("project").value || null,
          current_code: document.getElementById("editor").value,
          review_results: LAST_REVIEW }) });
    });
  </script>
</body>
</html>
