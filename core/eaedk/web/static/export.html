<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EAEDK — Export</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <nav class="top"></nav>
  <main>
    <h1>Export Build Files</h1>
    <p class="sub">Generate the real files for your project — starter code, build setup, flashing
      steps, and a START_HERE guide. Click a file to read it; download the whole bundle as a zip.</p>

    <div class="card">
      <label for="project">Project</label>
      <select id="project"><option value="">Loading projects…</option></select>
      <button id="run">Export</button>
    </div>

    <div id="result"></div>
  </main>

  <script>
    let CURRENT = null;

    async function init() {
      showCommand("eaedk export <project>");
      const ps = await api("/api/projects");
      const sel = document.getElementById("project");
      if (ps.error || !ps.projects.length) {
        sel.innerHTML = `<option value="">(no projects yet)</option>`;
        document.getElementById("result").innerHTML =
          `<div class="note">No projects yet. Create one on the <a href="setup.html">New Project</a> page.</div>`;
        return;
      }
      sel.innerHTML = ps.projects.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("");
      sel.addEventListener("change", () => showCommand(`eaedk export ${sel.value}`));
      showCommand(`eaedk export ${sel.value}`);
    }

    async function run() {
      const project = document.getElementById("project").value;
      const el = document.getElementById("result");
      if (!project) return;
      CURRENT = project;
      showCommand(`eaedk export ${project} --out ${project}-fw`);
      el.innerHTML = `<p class="kv">Exporting…</p>`;
      const r = await api("/api/export/" + encodeURIComponent(project), { method: "POST" });
      if (r.error) { showError(el, r); return; }
      const list = r.files.map(f =>
        `<li>📄 <a href="#" onclick="viewFile('${escapeHtml(f)}');return false;">${escapeHtml(f)}</a></li>`).join("");
      el.innerHTML = `
        ${r.geometry_unknown ? `<div class="error"><b>Heads up: this board is missing flash/RAM data,
          so these files won't compile yet.</b><div class="next">→ Fill in the board's geometry,
          then export again.</div></div>` : ""}
        <div class="grid" style="grid-template-columns: 280px 1fr; align-items:start">
          <div class="card"><b>Files</b>
            <ul class="tree">${list}</ul>
            <a href="/api/export/${encodeURIComponent(project)}/download"><button class="ghost">⬇ Download all (.zip)</button></a>
          </div>
          <div class="card" id="viewer"><span class="kv">Click a file to view it here.</span></div>
        </div>`;
    }

    async function viewFile(path) {
      const v = document.getElementById("viewer");
      v.innerHTML = `<span class="kv">Loading ${escapeHtml(path)}…</span>`;
      const r = await api(`/api/export/${encodeURIComponent(CURRENT)}/file?path=${encodeURIComponent(path)}`);
      if (r.error) { showError(v, r); return; }
      if (path.endsWith("START_HERE.md")) {
        v.innerHTML = `<div><b>${escapeHtml(path)}</b></div><div class="md">${renderMarkdown(r.content)}</div>`;
      } else {
        v.innerHTML = `<div><b>${escapeHtml(path)}</b></div><pre class="code">${escapeHtml(r.content)}</pre>`;
      }
    }

    /* Tiny, safe markdown renderer (headings, bold, inline code, fenced code, lists). */
    function renderMarkdown(src) {
      const lines = String(src).split("\n");
      let html = "", inCode = false, inList = false;
      const inline = s => escapeHtml(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      for (const ln of lines) {
        if (ln.trim().startsWith("```")) {
          if (!inCode) { html += '<pre class="code">'; inCode = true; }
          else { html += "</pre>"; inCode = false; }
          continue;
        }
        if (inCode) { html += escapeHtml(ln) + "\n"; continue; }
        if (/^#{1,3}\s/.test(ln)) {
          if (inList) { html += "</ul>"; inList = false; }
          const lvl = ln.match(/^#+/)[0].length;
          html += `<h${lvl+1} style="margin:14px 0 6px">${inline(ln.replace(/^#+\s/, ""))}</h${lvl+1}>`;
        } else if (/^\s*[-*]\s/.test(ln)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(ln.replace(/^\s*[-*]\s/, ""))}</li>`;
        } else if (ln.trim() === "") {
          if (inList) { html += "</ul>"; inList = false; }
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p style="margin:6px 0">${inline(ln)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      if (inCode) html += "</pre>";
      return html;
    }

    document.addEventListener("DOMContentLoaded", () => {
      init();
      document.getElementById("run").addEventListener("click", run);
    });
  </script>
</body>
</html>
