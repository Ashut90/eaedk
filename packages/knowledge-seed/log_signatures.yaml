# Deterministic log signatures for common bring-up failures (spec §4.8). Matched BEFORE any
# LLM triage. Each is a known pattern -> known cause + fix. Regexes are case-sensitive unless
# the pattern says otherwise.
- format: uboot
  pattern_regex: "Bad (Data CRC|Magic Number|Header Crc|CRC)"
  cause: "Boot image is corrupt or loaded to the wrong address (checksum/CRC mismatch)."
  fix: "Re-flash the image; verify the download size and that the load/entry addresses match the image header."
  severity: HIGH

- format: uboot
  pattern_regex: "DRAM:\\s*0 Bytes|DDR.*(init|training|calibration).*(fail|timeout)|ERROR.*DDR"
  cause: "DDR controller failed to initialize — timing parameters are likely wrong or unverified."
  fix: "Verify CL/tRCD/tRP and DDR size against the datasheet/TRM before first boot (see DDR_TIMING_VERIFIED)."
  severity: HIGH

- format: uboot
  pattern_regex: "Card did not respond to voltage select|MMC:.*timeout|mmc[0-9]*:.*error"
  cause: "SD/eMMC did not initialize (card seating, power, or pin-mux issue)."
  fix: "Check card power and seating, verify the MMC pin mux, and retry with a known-good card."
  severity: MEDIUM

- format: dmesg
  pattern_regex: "VFS: Unable to mount root fs|Kernel panic.*not syncing.*VFS"
  cause: "Root filesystem not found — wrong root= bootarg or a missing storage/filesystem driver."
  fix: "Check root= in bootargs; ensure the storage controller and filesystem are built into the kernel (not modules)."
  severity: HIGH

- format: dmesg
  pattern_regex: "Unable to handle kernel NULL pointer dereference|Internal error: Oops|kernel BUG at"
  cause: "Driver fault — a null/invalid pointer dereference during boot."
  fix: "Identify the faulting driver from the backtrace; review probe()/of_match_table; enable KASAN to localize."
  severity: HIGH

- format: uboot
  pattern_regex: "PLL.*(lock|locked).*(fail|timeout|timed out|not)|failed to lock PLL|clk.*PLL.*not.*lock|PLL lock timeout"
  cause: "Clock PLL failed to lock — bad oscillator/HSE source or out-of-range PLL multiplier/divider."
  fix: "Verify the input oscillator/HSE and the PLL M/N/P settings against the datasheet clock tree before relying on derived clocks."
  severity: HIGH

- format: uboot
  pattern_regex: "Bad signature|signature.*(verification)?.*(fail|invalid|bad)|secure boot.*(fail|denied)|verified boot.*fail|RSA.*verify.*fail|Hash Integrity.*(Failed|error)"
  cause: "Secure/verified boot rejected the image — signature or hash verification failed."
  fix: "Confirm the signing key matches the device public key/eFuse and that the image was signed for this boot stage (SPL/U-Boot/FIT)."
  severity: HIGH

# --- Bare-metal / MCU crashes (format: mcu) — the beginner's real failures ---

- format: mcu
  pattern_regex: "Guru Meditation.*(StoreProhibited|LoadProhibited)|EXCVADDR\\s*:\\s*0x0+\\b"
  cause: "ESP32 access fault (EXCCAUSE 0x1c/0x1d) — the program read or wrote an invalid address. EXCVADDR is the offending address; 0x00000000 means a null or uninitialised pointer."
  fix: "Find the faulting PC in the Backtrace (decode with the ESP-IDF Exception Decoder / addr2line). Look for a null, uninitialised, or freed pointer near that line."
  severity: HIGH

- format: mcu
  pattern_regex: "Guru Meditation Error|panic'ed|abort\\(\\) was called|CORRUPT HEAP"
  cause: "ESP32 panic — an unhandled exception or failed assertion stopped the core (it then reboots)."
  fix: "Read the exception type on the Guru Meditation line and decode the Backtrace for symbol names; enable core-dump or the Exception Decoder."
  severity: HIGH

- format: mcu
  pattern_regex: "HardFault|Hard Fault|HFSR\\s*[:=]|forced exception"
  cause: "Cortex-M HardFault — a fault escalated to the HardFault handler (HFSR.FORCED). The CPU hit something it could not handle."
  fix: "Decode CFSR to find the underlying fault. Common causes: null/bad pointer, unaligned access, stack overflow, or a call through a corrupt function pointer. Inspect the stacked PC/LR in the fault dump."
  severity: HIGH

- format: mcu
  pattern_regex: "CFSR\\s*[:=]|UsageFault|BusFault|MemManage|IACCVIOL|DACCVIOL|UNALIGNED|UNDEFINSTR|INVSTATE"
  cause: "Cortex-M configurable fault (CFSR) — a specific usage/bus/memory-management fault bit was set."
  fix: "Read CFSR bits: IACCVIOL/DACCVIOL = bad instruction/data access, UNALIGNED = unaligned access, UNDEFINSTR = bad/corrupt instruction or function pointer, STKERR/MSTKERR = stack overflow on exception entry."
  severity: HIGH
