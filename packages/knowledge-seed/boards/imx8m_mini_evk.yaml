soc:
  name: i.MX8M-Mini
  vendor: NXP
  arch: arm-cortex-a53
  notes: "Quad Cortex-A53 @ 1.8 GHz + Cortex-M4 coprocessor"
board:
  name: i.MX8M-Mini-EVK
  flash_base: null
  flash_bytes: null
  ram_base: 0x40000000
  ram_bytes: 2147483648       # 2 GB LPDDR4
  ddr_type: LPDDR4
  ddr_bytes: 2147483648
  primary_storage: emmc
  flash_endurance_cycles: null   # UNKNOWN — external/removable storage; endurance is the medium's, not confirmed per-board
  boot_modes: [emmc, sd, usb_sdp, spi_nor]
  confidence: HIGH
source:
  type: seed
  title: "i.MX 8M Mini Applications Processor Reference Manual (IMX8MMRM)"
  uri: "https://www.nxp.com/webapp/Download?colCode=IMX8MMRM"
  section: "System memory map"
  snippet: "DRAM region begins at 0x4000_0000; ROM boot from eMMC/SD/USB-SDP/SPI-NOR."
capabilities:
  - capability: ethernet
  - capability: usb
  - capability: uart
  - capability: emmc
  - capability: pcie
toolchain:
  - kind: compiler
    name: aarch64-linux-gnu-gcc
    target_triple: aarch64-linux-gnu
    min_version: "8.0"
    severity: HIGH
    why: "64-bit ARM (ARMv8-A) Linux SoC; needs an aarch64 cross-compiler, not the host gcc."
  - kind: build_system
    name: make
    severity: MEDIUM
    why: "U-Boot and the kernel build with make."
