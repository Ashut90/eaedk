soc:
  name: STM32MP157
  vendor: STMicroelectronics
  arch: arm-cortex-a7
  notes: "Dual Cortex-A7 @ 800 MHz + Cortex-M4; DDR/U-Boot bring-up exemplar"
board:
  name: STM32MP157
  flash_base: null
  flash_bytes: null
  ram_base: 0xC0000000
  ram_bytes: 536870912        # 512 MiB DDR3 (typical EV1 config)
  ddr_type: DDR3
  ddr_bytes: 536870912
  primary_storage: sd
  flash_endurance_cycles: null   # UNKNOWN — external/removable storage; endurance is the medium's, not confirmed per-board
  active_current_ma: null   # UNCONFIRMED (no datasheet value on file)
  sleep_current_ua: null
  min_voltage_v: null
  boot_modes: [sd, emmc, nor, uart, usb_dfu]
  confidence: HIGH
source:
  type: seed
  title: "STM32MP157 Reference Manual (RM0436)"
  uri: "https://www.st.com/resource/en/reference_manual/rm0436.pdf"
  section: "Memory organization / DDR controller"
  snippet: "DDR mapped at 0xC000_0000; boot ROM supports SD/eMMC/NOR/UART/USB-DFU."
capabilities:
  - capability: ethernet
  - capability: usb
  - capability: uart
  - capability: display
  - capability: sd
toolchain:
  - kind: compiler
    name: arm-linux-gnueabihf-gcc
    target_triple: arm-linux-gnueabihf
    min_version: "8.0"
    severity: HIGH
    why: "STM32MP1 runs 32-bit ARM Linux/U-Boot; you need an arm cross-compiler, not the host gcc."
  - kind: flash_tool
    name: openocd
    min_version: "0.11"
    severity: MEDIUM
    why: "OpenOCD (or STM32CubeProgrammer) loads SPL/U-Boot during bring-up."
  - kind: build_system
    name: make
    severity: MEDIUM
    why: "U-Boot, TF-A and the kernel build with make."
