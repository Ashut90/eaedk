soc:
  name: ATmega328P
  vendor: Microchip (Atmel)
  arch: avr
  notes: "8-bit AVR @ 16 MHz — the Arduino Uno's MCU; the most common first board"
board:
  name: Arduino-Uno
  flash_base: 0x00000000
  flash_bytes: 32768          # 32 KiB program flash
  ram_base: 0x00000100        # SRAM begins after the register/IO space
  ram_bytes: 2048             # 2 KiB SRAM
  primary_storage: internal_flash
  flash_endurance_cycles: 10000   # ATmega328P flash: 10,000 write/erase cycles (Atmel datasheet)
  boot_modes: [flash, bootloader]
  confidence: HIGH
source:
  type: seed
  title: "ATmega328P datasheet (DS40002061)"
  uri: "https://ww1.microchip.com/downloads/en/DeviceDoc/ATmega48A-PA-88A-PA-168A-PA-328-P-DS-DS40002061B.pdf"
  section: "Memories"
  snippet: "32 KB in-system programmable Flash; 2 KB internal SRAM."
capabilities:
  - capability: gpio
  - capability: timer
  - capability: uart
  - capability: spi
  - capability: i2c
toolchain:
  - kind: compiler
    name: avr-gcc
    target_triple: avr
    severity: HIGH
    why: "The ATmega328P is an 8-bit AVR; it needs avr-gcc, not an ARM compiler or the host gcc."
  - kind: sdk
    name: arduino-cli
    severity: LOW
    why: "Most beginners build Arduino sketches with the Arduino IDE or arduino-cli."
