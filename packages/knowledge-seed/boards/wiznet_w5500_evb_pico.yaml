soc:
  name: RP2040
  vendor: Raspberry Pi
  arch: arm-cortex-m0plus
  notes: "Dual Cortex-M0+ up to 133 MHz; no on-die program flash (boots external QSPI)"
board:
  name: WIZnet-W5500-EVB-Pico
  flash_base: 0x10000000      # XIP window for external QSPI NOR
  flash_bytes: 2097152        # 2 MiB external QSPI (W25Q16 on the EVB)
  ram_base: 0x20000000
  ram_bytes: 270336           # 264 KiB on-chip SRAM (6 banks)
  ddr_type: null
  ddr_bytes: null
  primary_storage: nor
  flash_endurance_cycles: null   # UNKNOWN — external/removable storage; endurance is the medium's, not confirmed per-board
  boot_modes: [bootrom_usb, bootrom_flash]
  confidence: HIGH
source:
  type: seed
  title: "RP2040 Datasheet + WIZnet W5500-EVB-Pico documentation"
  uri: "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf"
  section: "Memory map / XIP; boot sequence"
  snippet: "264 KiB SRAM at 0x2000_0000; XIP flash window at 0x1000_0000; bootrom loads 256-byte stage-2 from external QSPI. W5500 = hardwired TCP/IP over SPI."
capabilities:
  - capability: ethernet
    details_json: '{"controller": "WIZnet W5500", "interface": "spi", "compatible": "wiznet,w5500"}'
  - capability: spi
  - capability: usb
  - capability: uart
  - capability: i2c
  - capability: gpio
  - capability: timer
toolchain:
  - kind: compiler
    name: arm-none-eabi-gcc
    target_triple: arm-none-eabi
    min_version: "9.0"
    severity: HIGH
    why: "RP2040 is a Cortex-M0+; firmware needs the bare-metal ARM cross-compiler, not host gcc."
  - kind: build_system
    name: cmake
    severity: MEDIUM
    why: "The Raspberry Pi Pico SDK builds with CMake."
  - kind: sdk
    name: pioasm
    severity: LOW
    why: "RP2040 PIO state-machine programs are assembled by pioasm from the Pico SDK."
