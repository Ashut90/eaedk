# One factual anchor sentence per concept — a deterministic backbone the LLM mentor elaborates
# on (and the post-filter trims). Curated, not LLM-generated.
- name: hardfault
  anchor: "A HardFault is the Cortex-M CPU's 'something went unrecoverably wrong' exception — usually a bad/null pointer, an unaligned access, or a stack overflow."
- name: watchdog
  anchor: "A watchdog is a timer that resets the chip if your code stops periodically 'petting' it — a safety net against hangs."
- name: vector_table
  anchor: "The vector table is a list of handler addresses at the very start of flash; the CPU reads it on reset and on every interrupt to know where to jump."
- name: interrupt
  anchor: "An interrupt is the CPU pausing your main code to run a short handler when an event happens, then resuming where it left off."
- name: dma
  anchor: "DMA moves data between memory and a peripheral without the CPU, freeing the CPU to do other work."
- name: bootloader
  anchor: "A bootloader is a small program that runs first, can verify or update your main application, then jumps to it."
- name: uart
  anchor: "UART is asynchronous serial: two wires (TX and RX) and an agreed baud rate carry bytes between two devices."
- name: spi
  anchor: "SPI is a synchronous 4-wire bus (clock, two data lines, chip-select) where one controller talks to one or more peripherals."
- name: stack_overflow
  anchor: "A stack overflow is when function calls and local variables grow past the RAM reserved for the stack, corrupting other memory."
- name: gpio
  anchor: "GPIO is a general-purpose pin you configure as an output (to drive an LED) or an input (to read a button); each pin's direction and state live in the port's registers."
- name: uart-debug
  anchor: |
    Board boots but nothing prints on serial? Work down this list, in order — it's almost always one of these:
      1. Clock/init order — is the UART's peripheral clock enabled and the UART initialised BEFORE your first print? A print before init sends nothing.
      2. Baud rate — both sides must match. Set your terminal to 115200 8N1 (the EAEDK starter code's default), and make sure your baud divisor was computed from the ACTUAL clock (reset HSI: 8 MHz on STM32F1, 16 MHz on F4), not the max clock.
      3. Wiring — TX on the board must go to RX on your USB-serial adapter (TX→RX, not TX→TX), and the two grounds must be connected.
      4. Right pin/peripheral — confirm you configured the alternate-function for the exact TX pin you wired (e.g. PA9 = USART1_TX on a Blue Pill).
    Check them in this order; most "dead serial" bugs are #1 (init order) or #2 (baud).
