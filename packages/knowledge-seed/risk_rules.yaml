# Data-driven risk rules (spec §2.4). Conditions use the sandboxed mini-DSL.
- key: FLASH_TIGHT
  goal_type: null
  condition_dsl: "estimated_image_size > board.flash_bytes * 0.9"
  severity: HIGH
  explanation_tmpl: "Estimated image ({estimated_image_size} B) exceeds 90% of flash ({board.flash_bytes} B)."
  mitigation_tmpl: "Reduce image size, enable LTO/-Os, or move assets to external storage."

- key: RAM_TIGHT
  goal_type: null
  condition_dsl: "stack_size + heap_size > board.ram_bytes * 0.8"
  severity: MEDIUM
  explanation_tmpl: "Stack+heap ({stack_size}+{heap_size} B) exceeds 80% of RAM ({board.ram_bytes} B)."
  mitigation_tmpl: "Shrink stack/heap, or audit static allocation."

- key: WATCHDOG_UNCONFIRMED
  goal_type: bootloader
  condition_dsl: "watchdog_enabled == 0"
  severity: MEDIUM
  explanation_tmpl: "Watchdog not confirmed enabled from first instruction."
  mitigation_tmpl: "Enable IWDG/WWDG before main application handoff."

- key: DDR_GUESSED
  goal_type: uboot
  condition_dsl: "ddr_timing_verified == 0"
  severity: HIGH
  explanation_tmpl: "DDR timing not verified from datasheet."
  mitigation_tmpl: "Confirm CL/tRCD/tRP from the TRM before first boot."

# --- FLASH endurance (v2.7 P2.5) ----------------------------------------------------------
# Gated on write_rate: these rules do not apply until the engineer states a write rate.
# FLASH_ENDURANCE uses the multi-operand arithmetic grammar (write_rate * lifetime) and,
# when the board's endurance rating is UNCONFIRMED, fires at MEDIUM instead of dropping.
- key: FLASH_ENDURANCE
  goal_type: null
  requires: [write_rate]
  condition_dsl: "write_rate * projected_device_lifetime_seconds > board.flash_endurance_cycles"
  severity: HIGH
  severity_on_unknown: MEDIUM
  explanation_tmpl: "At {write_rate} write(s)/s over the device lifetime ({projected_device_lifetime_seconds} s) the firmware performs far more flash erase cycles than this board's rated endurance ({board.flash_endurance_cycles} cycles). Internal flash physically wears out and the device bricks in the field."
  mitigation_tmpl: "Cut the write rate, batch writes with wear-levelling (a small flash FS), or move logging to external storage (SD/eMMC/FRAM/EEPROM). Confirm the erase-cycle rating in the datasheet."

- key: FLASH_ENDURANCE_INTERNAL
  goal_type: null
  requires: [write_rate]
  condition_dsl: "write_rate > 100 and storage_is_internal_flash == 1"
  severity: HIGH
  explanation_tmpl: "{write_rate} write(s)/s to INTERNAL MCU flash is a wear hazard regardless of the exact rating — internal flash is rated for only ~10K-100K erase cycles and is not meant for high-frequency logging. At this rate the rated cycles are consumed in a fraction of the device's intended life."
  mitigation_tmpl: "Log to external storage (SD/eMMC/FRAM/EEPROM), batch and wear-level writes, or drop the write rate well below 100/s."

# --- Behavioural hazards (v3.0 P3) --------------------------------------------------------
# Timing, power, and ISR-context stack hazards — invisible to a pure capacity checker.
- key: TIMING_DEADLINE
  goal_type: null
  requires: [isr_frequency_hz, isr_budget_us]
  condition_dsl: "isr_frequency_hz > 1000 and isr_budget_us < 50"
  severity: HIGH
  explanation_tmpl: "At {isr_frequency_hz} interrupts/s with a {isr_budget_us}us budget, DMA contention, flash wait-states, or FPU context-save can push the ISR past its deadline and you start losing interrupts."
  mitigation_tmpl: "Shorten the ISR (defer work to a task), raise the budget, lower the rate, or move the hot path to RAM. Measure worst-case ISR time on hardware."

# Uses the v3.0 grammar extension unset(): fires only when the engineer gave a rate + RTOS but NO
# budget — a prompt to supply isr_budget_us so timing margin can actually be validated.
- key: TIMING_DEADLINE_RTOS
  goal_type: null
  requires: [isr_frequency_hz, has_rtos]
  condition_dsl: "isr_frequency_hz > 0 and has_rtos == 1 and unset(isr_budget_us) == 1"
  severity: MEDIUM
  explanation_tmpl: "An RTOS tick adds scheduling jitter on top of your {isr_frequency_hz}/s interrupt, but no isr_budget_us was provided — timing margin cannot be validated."
  mitigation_tmpl: "Provide isr_budget_us (your worst-case ISR execution time) so EAEDK can check it against the deadline."

- key: POWER_BUDGET
  goal_type: null
  requires: [target_current_ma]
  condition_dsl: "board.active_current_ma > target_current_ma"
  severity: HIGH
  explanation_tmpl: "This board's typical active current ({board.active_current_ma} mA) exceeds your {target_current_ma} mA power budget — at full activity it will not meet the budget."
  mitigation_tmpl: "To hit {target_current_ma} mA on a {board.active_current_ma} mA board you must keep it ACTIVE at most {power_budget_duty_pct}% of the time (duty cycle) and in sleep/stop mode the rest. Either duty-cycle to that figure, or raise the budget. Confirm active current at your clock speed in the datasheet."

- key: STACK_OVERFLOW_ISR
  goal_type: null
  requires: [isr_frequency_hz, stack_size]
  condition_dsl: "isr_frequency_hz > 0 and stack_size < 512"
  severity: HIGH
  explanation_tmpl: "With interrupts active ({isr_frequency_hz}/s) and only {stack_size} B of stack, an ISR context-save on top of nested calls can overflow the stack and silently corrupt memory."
  mitigation_tmpl: "Give the stack headroom for the worst-case ISR nesting (>=512 B as a floor), watch the stack high-water mark, and keep ISRs shallow."
